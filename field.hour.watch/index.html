<h1>Fieldhour</h1>
<p>Fieldhour turns a visual meteor watch into an hourly rate.</p>
<p>Count stars in one of the built-in areas, then tap once for each meteor. The app keeps the watch on this iPhone and shows the zenithal hourly rate for that night.</p>
