<h1>Pantry Tick</h1>
<p>Pantry Tick keeps use-by dates for food and medicine on this iPhone.</p>
<p>Log a name and a date, then read the three counts: past due, soon, and still fine. Filter by Fridge, Freezer, Pantry, or Meds. Share a list when you want someone else to see what is left.</p>
